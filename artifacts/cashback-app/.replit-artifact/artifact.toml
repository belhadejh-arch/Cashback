kind = "web"
previewPath = "/"
title = "Cash Back"
description = "تطبيق كاش باك عربي يتيح للعملاء والتجار متابعة المشتريات والاسترداد النقدي وإدارة العمليات."
version = "1.0.0"
id = "artifacts/cashback-app"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20396

[services.development]
run = "pnpm --filter @workspace/cashback-app run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/cashback-app", "run", "build" ]
serve = "static"
publicDir = "artifacts/cashback-app/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20396"
BASE_PATH = "/"
