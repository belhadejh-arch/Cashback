openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: cashback
    description: CASH BACK application
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /cashback/session:
    get:
      operationId: getCashbackSession
      tags: [cashback]
      summary: Load the authenticated user's CASH BACK data
      responses:
        "200":
          description: Profile and role-scoped application data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CashbackSession"
  /cashback/health:
    get:
      operationId: cashbackDataHealth
      tags: [cashback]
      summary: Check Neon connectivity without returning account data
      responses:
        "200":
          description: Neon is available
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
        "503":
          description: Neon is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /cashback/register:
    post:
      operationId: registerCashbackProfile
      tags: [cashback]
      summary: Create a customer profile or merchant application
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CashbackRegistration"
      responses:
        "201":
          description: Profile created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CashbackProfile"
  /cashback/auth/login:
    post:
      operationId: loginCashback
      tags: [cashback]
      summary: Sign in with an email address or verified phone and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CashbackLogin"
      responses:
        "200":
          description: Authenticated profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CashbackProfile"
  /cashback/auth/logout:
    post:
      operationId: logoutCashback
      tags: [cashback]
      summary: End the current session
      responses:
        "200":
          description: Session ended
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActionResult"
  /cashback/receipts:
    post:
      operationId: submitCashbackReceipt
      tags: [cashback]
      summary: Submit a receipt for review
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CashbackReceiptInput"
      responses:
        "201":
          description: Receipt queued for review
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CashbackReceipt"
  /cashback/receipts/upload-url:
    post:
      operationId: createCashbackReceiptPhotoUpload
      tags: [cashback]
      summary: Create a private short-lived receipt photo upload
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReceiptPhotoUploadInput"
      responses:
        "200":
          description: Receipt photo upload details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReceiptPhotoUpload"
  /cashback/receipts/{id}/decision:
    patch:
      operationId: decideCashbackReceipt
      tags: [cashback]
      summary: Approve or reject a receipt as an administrator
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CashbackReceiptDecision"
      responses:
        "200":
          description: Receipt reviewed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActionResult"
  /cashback/receipts/{id}:
    delete:
      operationId: cancelCashbackReceipt
      tags: [cashback]
      summary: Cancel an owned receipt that is still under review
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Receipt cancelled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActionResult"
  /cashback/merchants/{id}/decision:
    patch:
      operationId: decideCashbackMerchant
      tags: [cashback]
      summary: Approve or reject a merchant application
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CashbackMerchantDecision"
      responses:
        "200":
          description: Merchant application reviewed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActionResult"
  /cashback/merchants/{id}/rating:
    post:
      operationId: rateCashbackMerchant
      tags: [cashback]
      summary: Rate a merchant after an approved receipt
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CashbackMerchantRating"
      responses:
        "200":
          description: Merchant rating saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActionResult"
  /cashback/merchant/assets/upload-url:
    post:
      operationId: createCashbackMerchantAssetUpload
      tags: [cashback]
      summary: Create an owner-bound merchant image upload
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CashbackMerchantAssetUploadInput"
      responses:
        "201":
          description: Upload URL created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CashbackMerchantAssetUpload"
  /cashback/merchant/store:
    patch:
      operationId: updateCashbackMerchantStore
      tags: [cashback]
      summary: Update editable merchant store information
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CashbackMerchantStoreUpdate"
      responses:
        "200":
          description: Store information updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActionResult"
  /cashback/merchant/store-change-requests:
    post:
      operationId: createCashbackMerchantStoreChangeRequest
      tags: [cashback]
      summary: Request approval for sensitive store changes
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CashbackMerchantSensitiveChangeInput"
      responses:
        "201":
          description: Sensitive changes submitted for review
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActionResult"
  /cashback/admin/store-change-requests/{id}/decision:
    patch:
      operationId: decideCashbackMerchantStoreChange
      tags: [cashback]
      summary: Approve or reject sensitive merchant changes
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, minLength: 1, maxLength: 100 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CashbackMerchantSensitiveChangeDecision"
      responses:
        "200":
          description: Change request reviewed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActionResult"
  /cashback/merchant/topups:
    post:
      operationId: createCashbackMerchantTopup
      tags: [cashback]
      summary: Submit a merchant balance top-up request
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CashbackMerchantTopupInput"
      responses:
        "201":
          description: Top-up request submitted for review
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActionResult"
  /cashback/admin/topups/{id}/decision:
    patch:
      operationId: decideCashbackMerchantTopup
      tags: [cashback]
      summary: Approve or reject a merchant top-up
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, minLength: 1, maxLength: 100 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CashbackMerchantTopupDecision"
      responses:
        "200":
          description: Top-up reviewed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActionResult"
  /cashback/merchant/withdrawals:
    post:
      operationId: createCashbackMerchantWithdrawal
      tags: [cashback]
      summary: Request withdrawal of merchant QR payment proceeds
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CashbackMerchantWithdrawalInput"
      responses:
        "201":
          description: Withdrawal request submitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActionResult"
  /cashback/admin/withdrawals/{id}/update:
    patch:
      operationId: updateCashbackMerchantWithdrawal
      tags: [cashback]
      summary: Update merchant withdrawal processing status
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, minLength: 1, maxLength: 100 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CashbackMerchantWithdrawalUpdate"
      responses:
        "200":
          description: Withdrawal updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActionResult"
  /cashback/settings/payment-methods:
    patch:
      operationId: updateCashbackPaymentMethods
      tags: [cashback]
      summary: Configure merchant top-up payment instructions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CashbackPaymentMethodsUpdate"
      responses:
        "200":
          description: Payment methods saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActionResult"
  /cashback/merchant/notifications/read-all:
    post:
      operationId: markCashbackMerchantNotificationsRead
      tags: [cashback]
      summary: Mark all merchant notifications as read
      responses:
        "200":
          description: Notifications marked as read
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActionResult"
  /cashback/wallet/payment-sessions:
    post:
      operationId: createCashbackPaymentSession
      tags: [cashback]
      summary: Create a short-lived customer session after validating a merchant QR
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CashbackPaymentSessionInput"
      responses:
        "201":
          description: QR validated and payment session created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CashbackPaymentSession"
  /cashback/wallet/redemptions:
    post:
      operationId: redeemMerchantCashback
      tags: [cashback]
      summary: Confirm a one-time QR payment using merchant-scoped cashback
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CashbackRedemption"
      responses:
        "201":
          description: QR payment confirmed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CashbackPaymentResult"
  /cashback/wallet/payments/{id}/reversal:
    post:
      operationId: reverseCashbackPayment
      tags: [cashback]
      summary: Reverse a completed QR payment as an administrator
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, minLength: 1, maxLength: 80 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CashbackPaymentReversal"
      responses:
        "200":
          description: Payment reversed and balances restored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActionResult"
  /cashback/profile/preferences:
    patch:
      operationId: updateCashbackPreferences
      tags: [cashback]
      summary: Save account language and theme preferences
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CashbackPreferences"
      responses:
        "200":
          description: Preferences updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CashbackProfile"
  /cashback/profile/photo/upload-url:
    post:
      operationId: createCashbackProfilePhotoUpload
      tags: [cashback]
      summary: Create a short-lived private upload URL for a profile photo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfilePhotoUploadInput"
      responses:
        "201":
          description: Upload URL created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfilePhotoUpload"
  /cashback/profile/photo:
    patch:
      operationId: saveCashbackProfilePhoto
      tags: [cashback]
      summary: Attach an uploaded image to the authenticated profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfilePhotoFinalizeInput"
      responses:
        "200":
          description: Profile photo updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfilePhotoResult"
    get:
      operationId: getCashbackProfilePhoto
      tags: [cashback]
      summary: Read the authenticated user's private profile photo
      responses:
        "200":
          description: Profile photo bytes
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
            image/webp:
              schema:
                type: string
                format: binary
  /cashback/settings/rate:
    patch:
      operationId: updateCashbackRate
      tags: [cashback]
      summary: Update the cashback percentage as an administrator
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CashbackRateUpdate"
      responses:
        "200":
          description: Rate updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActionResult"
  /cashback/settings/categories:
    patch:
      operationId: updateCashbackCategories
      tags: [cashback]
      summary: Update the active merchant categories
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CashbackCategoriesUpdate"
      responses:
        "200":
          description: Categories updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActionResult"
  /cashback/media/{id}:
    get:
      operationId: getCashbackMedia
      tags: [cashback]
      summary: Read an image belonging to the authenticated account
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Image bytes
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    CashbackProfile:
      type: object
      required: [uid, role, eid, name]
      properties:
        uid: { type: string }
        role: { type: string, enum: [customer, merchant, admin] }
        eid: { type: string }
        name: { type: string }
        phone: { type: ["string", "null"] }
        email: { type: ["string", "null"] }
        avatarUpdatedAt: { type: ["integer", "null"] }
        preferences:
          type: object
          additionalProperties: true
    CashbackState:
      type: object
      additionalProperties: true
    ReceiptPhotoUploadInput:
      type: object
      required: [contentType, size]
      properties:
        contentType: { type: string, enum: [image/jpeg, image/png, image/webp] }
        size: { type: integer, minimum: 1, maximum: 5242880 }
    ReceiptPhotoUpload:
      type: object
      required: [uploadURL, objectPath, uploadId]
      properties:
        uploadURL: { type: string, format: uri }
        objectPath: { type: string }
        uploadId: { type: string }
    CashbackSession:
      type: object
      required: [profile, state]
      properties:
        profile: { $ref: "#/components/schemas/CashbackProfile" }
        state: { $ref: "#/components/schemas/CashbackState" }
    CashbackRegistration:
      type: object
      required: [role, name, email, password]
      properties:
        role: { type: string, enum: [customer, merchant] }
        name: { type: string, minLength: 2, maxLength: 100 }
        email: { type: string, format: email, maxLength: 254 }
        password: { type: string, minLength: 8, maxLength: 128 }
        phone: { type: ["string", "null"], maxLength: 20 }
        country: { type: string, enum: [Algeria, Libya] }
        city: { type: string, maxLength: 100 }
        address: { type: string, maxLength: 300 }
        mapsUrl: { type: string, maxLength: 500 }
        category: { type: string, maxLength: 40 }
        logoData: { type: string, maxLength: 650000 }
    CashbackLogin:
      type: object
      required: [password]
      properties:
        identifier: { type: string, minLength: 1, maxLength: 254, description: Email address or verified phone number }
        email: { type: string, maxLength: 254, description: Legacy email field }
        password: { type: string, minLength: 8, maxLength: 128 }
        role: { type: string, enum: [customer, merchant], description: Expected account type }
    CashbackReceiptInput:
      type: object
      required: [merchantId, amount, date]
      properties:
        merchantId: { type: string, minLength: 1 }
        invoiceNumber: { type: ["string", "null"], maxLength: 100 }
        amount: { type: number, exclusiveMinimum: 0, maximum: 100000000 }
        date: { type: string, format: date }
        uploadId: { type: string, maxLength: 80 }
        objectPath: { type: string, maxLength: 500 }
    CashbackMerchantRating:
      type: object
      required: [rating]
      properties:
        rating: { type: integer, minimum: 1, maximum: 5 }
    CashbackMerchantAssetUploadInput:
      type: object
      required: [asset, contentType, size]
      properties:
        asset: { type: string, enum: [logo, cover, topup-proof] }
        contentType: { type: string, enum: [image/jpeg, image/png, image/webp] }
        size: { type: integer, minimum: 1, maximum: 5242880 }
    CashbackMerchantAssetUpload:
      type: object
      required: [uploadURL, objectPath, uploadId]
      properties:
        uploadURL: { type: string, format: uri }
        objectPath: { type: string }
        uploadId: { type: string }
    CashbackMerchantStoreUpdate:
      type: object
      properties:
        name: { type: string, minLength: 2, maxLength: 100 }
        phone: { type: ["string", "null"], maxLength: 20 }
        description: { type: string, maxLength: 2000 }
        address: { type: string, maxLength: 300 }
        mapsUrl: { type: string, maxLength: 500 }
        lat: { type: ["number", "null"], minimum: -90, maximum: 90 }
        lng: { type: ["number", "null"], minimum: -180, maximum: 180 }
        openingHours: { type: string, maxLength: 500 }
        logoUploadId: { type: string, maxLength: 100 }
        logoObjectPath: { type: string, maxLength: 500 }
        coverUploadId: { type: string, maxLength: 100 }
        coverObjectPath: { type: string, maxLength: 500 }
    CashbackMerchantSensitiveChangeInput:
      type: object
      properties:
        country: { type: string, enum: [Algeria, Libya] }
        category: { type: string, enum: [restaurants, cafes, clothing, electronics, malls, groceries, perfume, gifts, shops, other] }
        legalName: { type: string, maxLength: 160 }
        registrationNumber: { type: string, maxLength: 100 }
        taxNumber: { type: string, maxLength: 100 }
    CashbackMerchantSensitiveChangeDecision:
      type: object
      required: [approved]
      properties:
        approved: { type: boolean }
        reason: { type: ["string", "null"], maxLength: 300 }
    CashbackMerchantTopupInput:
      type: object
      required: [amount, paymentMethodId, uploadId, objectPath]
      properties:
        amount: { type: number, exclusiveMinimum: 0 }
        paymentMethodId: { type: string, minLength: 1, maxLength: 100 }
        payerReference: { type: string, maxLength: 120 }
        uploadId: { type: string, minLength: 1, maxLength: 100 }
        objectPath: { type: string, minLength: 1, maxLength: 500 }
    CashbackMerchantTopupDecision:
      type: object
      required: [approved]
      properties:
        approved: { type: boolean }
        reason: { type: ["string", "null"], maxLength: 300 }
    CashbackMerchantWithdrawalInput:
      type: object
      required: [amount, method, accountDetails]
      properties:
        amount: { type: number, exclusiveMinimum: 0, maximum: 100000000 }
        method: { type: string, minLength: 1, maxLength: 80 }
        accountDetails: { type: string, minLength: 3, maxLength: 300 }
    CashbackMerchantWithdrawalUpdate:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [approved, transferring, paid, rejected] }
        reason: { type: ["string", "null"], maxLength: 300 }
        transferReference: { type: string, maxLength: 120 }
    CashbackPaymentMethod:
      type: object
      required: [id, country, name, beneficiary, account, instructions, active]
      properties:
        id: { type: string, minLength: 1, maxLength: 100 }
        country: { type: string, enum: [Algeria, Libya] }
        name: { type: string, minLength: 1, maxLength: 100 }
        beneficiary: { type: string, minLength: 1, maxLength: 160 }
        account: { type: string, minLength: 1, maxLength: 160 }
        phone: { type: string, maxLength: 30 }
        instructions: { type: string, minLength: 1, maxLength: 1000 }
        active: { type: boolean }
    CashbackPaymentMethodsUpdate:
      type: object
      required: [methods]
      properties:
        methods:
          type: array
          maxItems: 30
          items: { $ref: "#/components/schemas/CashbackPaymentMethod" }
        maxTopupAmountDzd: { type: ["number", "null"], minimum: 1000 }
        maxTopupAmountLyd: { type: ["number", "null"], minimum: 10 }
    CashbackCategoriesUpdate:
      type: object
      required: [categories]
      properties:
        categories:
          type: array
          minItems: 1
          maxItems: 9
          uniqueItems: true
          items:
            type: string
            enum: [restaurants, cafes, clothing, electronics, malls, groceries, perfume, gifts, shops]
    CashbackReceipt:
      type: object
      additionalProperties: true
    CashbackReceiptDecision:
      type: object
      required: [approved]
      properties:
        approved: { type: boolean }
        reason: { type: ["string", "null"], maxLength: 300 }
    CashbackMerchantDecision:
      type: object
      required: [approved]
      properties:
        approved: { type: boolean }
        reason: { type: ["string", "null"], maxLength: 300 }
    CashbackRedemption:
      type: object
      required: [sessionId, amount]
      properties:
        sessionId: { type: string, minLength: 16, maxLength: 80 }
        amount: { type: number, exclusiveMinimum: 0, maximum: 100000000 }
    CashbackPaymentSessionInput:
      type: object
      required: [merchantId, qrValue]
      properties:
        merchantId: { type: string, minLength: 1, maxLength: 80 }
        qrValue: { type: string, minLength: 1, maxLength: 240 }
    CashbackPaymentSession:
      type: object
      required: [sessionId, merchantId, merchantName, balance, expiresAt]
      properties:
        sessionId: { type: string }
        merchantId: { type: string }
        merchantName: { type: string }
        country: { type: ["string", "null"] }
        balance: { type: number }
        expiresAt: { type: integer }
    CashbackPaymentResult:
      type: object
      required: [id, reference, status, amount, merchantId, remainingBalance, merchantBalance, at]
      properties:
        id: { type: string }
        reference: { type: string }
        status: { type: string, enum: [done] }
        amount: { type: number }
        merchantId: { type: string }
        remainingBalance: { type: number }
        merchantBalance: { type: number }
        at: { type: integer }
    CashbackPaymentReversal:
      type: object
      required: [reason]
      properties:
        reason: { type: string, minLength: 3, maxLength: 300 }
    CashbackPreferences:
      type: object
      required: [language, theme]
      properties:
        language: { type: string, enum: [ar, en, fr] }
        theme: { type: string, enum: [dark, light] }
    ProfilePhotoUploadInput:
      type: object
      required: [contentType, size]
      properties:
