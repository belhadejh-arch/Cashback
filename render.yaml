services:
  - type: web
    name: cashback-api
    runtime: node
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm --filter @workspace/api-server run build
    startCommand: pnpm --filter @workspace/api-server run start
    healthCheckPath: /api/cashback/health
    disk:
      name: cashback-media
      mountPath: /var/data/cashback-media
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: APP_STORAGE_DRIVER
        value: render-disk
      - key: APP_STORAGE_DIR
        value: /var/data/cashback-media
      - key: NEON_DATABASE_URL
        sync: false
      - key: CASHBACK_ADMIN_BOOTSTRAP_TOKEN
        sync: false
